<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --page: #EEF3F0;
    --surface: #FFFFFF;
    --ink: #0F2F29;
    --text: #17302B;
    --muted: #5A6F69;
    --line: #D3DCD8;
    --field-line: #B4C2BD;
    --accent: #0F6B5C;
    --accent-hover: #0B554A;
    --tint: #F1F6F4;
    --saffron: #E8A317;
    --danger: #B3261E;
    --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; background: var(--page); color: var(--text); font: 400 16px/1.5 var(--body); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid rgba(15, 107, 92, .5); outline-offset: 2px; }

  /* ---------- Summary band ---------- */
  .band { background: var(--ink); color: #EAF3F0; padding: 28px 20px 26px; }
  .band-inner { max-width: 1180px; margin: 0 auto; }
  .band h1 { margin: 0 0 16px; font: 500 1.05rem/1.2 var(--display); color: #A9CBC2; }
  .total { font: 700 clamp(2.6rem, 7vw, 4.5rem)/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .caption { margin: 8px 0 22px; color: #A9CBC2; min-height: 1.5em; }
  .bar { display: flex; gap: 2px; height: 16px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.12); }
  .bar span { display: block; height: 100%; min-width: 3px; }
  .legend { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .875rem; }
  .legend li { display: flex; align-items: center; gap: 8px; }
  .legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

  /* ---------- Layout ---------- */
  .layout { max-width: 1180px; margin: 0 auto; padding: 28px 20px 72px; display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  @media (min-width: 901px) and (min-height: 860px) { .form-panel { position: sticky; top: 20px; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .panel h2 { margin: 0 0 18px; font: 700 1.3rem/1.2 var(--display); }

  /* ---------- Form ---------- */
  .field { margin-bottom: 16px; }
  label, .label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .9rem; }
  .optional { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; color: inherit;
    background: #fff; border: 1px solid var(--field-line); border-radius: 8px;
  }
  textarea { min-height: 76px; resize: vertical; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  fieldset { border: 0; margin: 0 0 16px; padding: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 6px; font-weight: 600; font-size: .9rem; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg label { position: relative; margin: 0; font-weight: 500; cursor: pointer; }
  .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .seg span { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 8px; background: #fff; border: 1px solid var(--field-line); border-radius: 8px; text-align: center; }
  .seg input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg input:focus-visible + span { outline: 3px solid rgba(15, 107, 92, .5); outline-offset: 2px; }

  .bill-drop { position: relative; display: flex; align-items: center; gap: 10px; margin: 0; padding: 12px; font-weight: 500; color: var(--muted); border: 1.5px dashed #9FB3AC; border-radius: 8px; cursor: pointer; }
  .bill-drop:hover { border-color: var(--accent); color: var(--text); }
  .bill-drop:focus-within { outline: 3px solid rgba(15, 107, 92, .5); outline-offset: 2px; }
  .bill-drop input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .hint { margin: 6px 0 0; font-size: .8rem; color: var(--muted); }
  .bill-current { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 8px; padding: 8px 12px; background: var(--tint); border-radius: 8px; font-size: .9rem; }
  .bill-current .name { font-weight: 500; overflow-wrap: anywhere; }
  .bill-current small { display: block; color: var(--muted); font-weight: 400; }

  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; }
  .btn-primary { background: var(--accent); color: #fff; flex: 1; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-quiet { background: transparent; border-color: var(--field-line); color: var(--text); }
  .btn-quiet:hover { background: var(--tint); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .link-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px; background: none; border: 0; border-radius: 6px; color: var(--accent); font-weight: 600; font-size: .9rem; }
  .link-btn:hover { background: #E3EEEA; }
  .link-btn.danger { color: var(--danger); }
  .link-btn.danger:hover { background: #FBE9E7; }

  /* ---------- Ledger ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .toolbar .field { margin: 0; flex: 1 1 180px; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 14px 18px 10px 14px; border-bottom: 1px solid var(--line); border-left: 4px solid transparent; }
  .item:last-child { border-bottom: 0; }
  .item.editing { border-left-color: var(--saffron); background: #FFF9EB; }
  .item-title { font-weight: 600; overflow-wrap: anywhere; }
  .item-amount { grid-column: 2; grid-row: 1; text-align: right; white-space: nowrap; font: 700 1.15rem/1.4 var(--display); font-variant-numeric: tabular-nums; }
  .item-meta { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: .875rem; color: var(--muted); }
  .cat { display: inline-flex; align-items: center; gap: 7px; color: var(--text); font-weight: 500; }
  .item-notes { grid-column: 1 / -1; font-size: .875rem; color: var(--muted); overflow-wrap: anywhere; }
  .item-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0 0 -10px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty strong { display: block; margin-bottom: 4px; font: 700 1.1rem/1.3 var(--display); color: var(--text); }

  /* ---------- Dialogs ---------- */
  dialog { width: min(92vw, 900px); padding: 0; border: 0; border-radius: 12px; color: var(--text); }
  dialog::backdrop { background: rgba(9, 28, 24, .62); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font: 700 1.05rem/1.3 var(--display); overflow-wrap: anywhere; }
  .dlg-body { display: flex; align-items: center; justify-content: center; min-height: 220px; max-height: 72vh; padding: 12px; overflow: auto; background: var(--tint); color: var(--muted); }
  .dlg-body img { max-width: 100%; max-height: 68vh; object-fit: contain; border-radius: 4px; }
  .dlg-body iframe { width: 100%; height: 68vh; border: 0; background: #fff; }
  .dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .dlg-foot a { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 12px; color: var(--accent); font-weight: 600; font-size: .9rem; text-decoration: none; border-radius: 6px; }
  .dlg-foot a:hover { background: #E3EEEA; }
  .dlg-foot a[hidden] { display: none; }
  #confirmDialog { width: min(92vw, 420px); }
  .confirm-body { padding: 22px; }
  .confirm-body h2 { margin: 0 0 8px; font: 700 1.2rem/1.3 var(--display); }
  .confirm-body p { margin: 0 0 20px; color: var(--muted); overflow-wrap: anywhere; }
  .confirm-body .actions { justify-content: flex-end; margin: 0; }

  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; max-width: 90vw; padding: 12px 18px; background: var(--ink); color: #fff; border-radius: 10px; opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header class="band">
  <div class="band-inner">
    <h1>Household expenses</h1>
    <div class="total" id="total">—</div>
    <p class="caption" id="caption"></p>
    <div class="bar" id="bar" role="img" aria-label="Spending split by category"></div>
    <ul class="legend" id="legend"></ul>
  </div>
</header>

<main class="layout">
  <section class="panel form-panel" aria-labelledby="formTitle">
    <h2 id="formTitle">Add an expense</h2>
    <form id="expenseForm" autocomplete="off">
      <div class="pair">
        <div class="field">
          <label for="fDate">Date</label>
          <input type="date" id="fDate" required>
        </div>
        <div class="field">
          <label for="fAmount">Amount (₹)</label>
          <input type="number" id="fAmount" step="any" inputmode="decimal" placeholder="0.00" required>
        </div>
      </div>

      <div class="field">
        <label for="fDesc">Expense description</label>
        <input type="text" id="fDesc" placeholder="e.g. Monthly milk bill" required>
      </div>

      <div class="field">
        <label for="fCategory">Category</label>
        <select id="fCategory" required></select>
      </div>

      <fieldset>
        <legend>Paid by</legend>
        <div class="seg" id="paidBy"></div>
      </fieldset>

      <div class="field">
        <label for="fNotes">Notes <span class="optional">(optional)</span></label>
        <textarea id="fNotes"></textarea>
      </div>

      <div class="field">
        <span class="label">Bill <span class="optional">(optional)</span></span>
        <div id="billState"></div>
        <label class="bill-drop" for="fFile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span id="dropText">Attach a PDF or image</span>
          <input type="file" id="fFile" accept="application/pdf,image/jpeg,image/png,image/webp,image/gif">
        </label>
        <p class="hint">PDF, JPG, PNG, WebP or GIF, up to 10 MB.</p>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">Add expense</button>
        <button type="button" class="btn btn-quiet" id="cancelBtn" hidden>Cancel</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="ledgerTitle">
    <h2 id="ledgerTitle" style="position:absolute;left:-9999px">Expenses</h2>
    <div class="toolbar">
      <div class="field">
        <label for="fMonth">Month</label>
        <select id="fMonth"></select>
      </div>
      <div class="field">
        <label for="fFilterCat">Category</label>
        <select id="fFilterCat"></select>
      </div>
    </div>
    <ul class="list" id="list"></ul>
  </section>
</main>

<dialog id="billDialog" aria-labelledby="billTitle">
  <div class="dlg-head">
    <h2 id="billTitle">Bill</h2>
    <button type="button" class="btn btn-quiet" id="billClose">Close</button>
  </div>
  <div class="dlg-body" id="billBody"></div>
  <div class="dlg-foot">
    <a id="billOpen" target="_blank" rel="noopener" hidden>Open in new tab</a>
    <a id="billDownload" hidden>Download</a>
  </div>
</dialog>

<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <form method="dialog" class="confirm-body">
    <h2 id="confirmTitle">Delete this expense?</h2>
    <p id="confirmText"></p>
    <div class="actions">
      <button type="submit" value="cancel" class="btn btn-quiet">Keep expense</button>
      <button type="submit" value="delete" class="btn btn-danger">Delete expense</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- Configuration ---------- */
  const SUPABASE_URL = "https://dlwimgoimwfuqoxyvewq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsd2ltZ29pbXdmdXFveHl2ZXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTE4NzYsImV4cCI6MjEwNTQ4Nzg3Nn0.u4D0j10SGqe2WWU9O0bQzR2nLUE3t-o1VHKrdAv3KrI";
  const TABLE = 'expenses';
  const BUCKET = 'bills';

  let api = null;
  try { api = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error(e); }

  const CATEGORIES = ['Parents Maintenance', 'Home Maintenance', 'Home Loan', 'Milk', 'Non-veg', 'Rachael', 'Petrol', 'Vegetable', 'Groceries', 'Mobile', 'WiFi'];
  const PAID_BY = ['Cash/GPAY', 'Amazon Pay ICICI', 'SBI', 'HDFC Swiggy', 'Others'];
  const COLORS = {
    'Parents Maintenance': '#3FA58C', 'Home Maintenance': '#8BB174', 'Home Loan': '#5C86C7',
    'Milk': '#A8C7DB', 'Non-veg': '#D8674F', 'Rachael': '#D68DB4', 'Petrol': '#B08B4F',
    'Vegetable': '#B7D34F', 'Groceries': '#E8A317', 'Mobile': '#8A8CE0', 'WiFi': '#4CC1D3'
  };
  const ALLOWED_TYPES = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp', 'image/gif'];
  const MAX_FILE = 10 * 1024 * 1024;

  /* ---------- Helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  const todayStr = () => new Date().toLocaleDateString('en-CA');
  const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  const monthLabel = (k) => new Date(k + '-01T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const currentMonth = () => todayStr().slice(0, 7);
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

  const ICON = {
    clip: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
  };

  const els = {
    total: $('total'), caption: $('caption'), bar: $('bar'), legend: $('legend'),
    form: $('expenseForm'), formTitle: $('formTitle'), date: $('fDate'), amount: $('fAmount'),
    desc: $('fDesc'), category: $('fCategory'), paidBy: $('paidBy'), notes: $('fNotes'),
    file: $('fFile'), billState: $('billState'), dropText: $('dropText'),
    submit: $('submitBtn'), cancel: $('cancelBtn'),
    month: $('fMonth'), filterCat: $('fFilterCat'), list: $('list'),
    billDialog: $('billDialog'), billTitle: $('billTitle'), billBody: $('billBody'),
    billOpen: $('billOpen'), billDownload: $('billDownload'), billClose: $('billClose'),
    confirm: $('confirmDialog'), confirmText: $('confirmText'), toast: $('toast')
  };

  const state = {
    entries: [], loading: true, loadError: false, saving: false,
    editingId: null, file: null, removeBill: false,
    month: currentMonth(), category: ''
  };

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(message, type) {
    els.toast.textContent = message;
    els.toast.className = 'toast show' + (type === 'error' ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { els.toast.className = 'toast'; }, type === 'error' ? 5000 : 2800);
  }

  /* ---------- Static form options ---------- */
  els.category.innerHTML = '<option value="" disabled selected>Choose a category</option>' +
    CATEGORIES.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  els.filterCat.innerHTML = '<option value="">All categories</option>' +
    CATEGORIES.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  els.paidBy.innerHTML = PAID_BY.map((p, i) =>
    `<label><input type="radio" name="paid_by" value="${esc(p)}"${i === 0 ? ' checked' : ''}><span>${esc(p)}</span></label>`
  ).join('');
  els.date.value = todayStr();

  /* ---------- Data ---------- */
  function sortEntries() {
    state.entries.sort((a, b) =>
      b.expense_date.localeCompare(a.expense_date) || String(b.created_at).localeCompare(String(a.created_at)));
  }

  async function loadEntries() {
    state.loading = true; state.loadError = false; renderAll();
    try {
      if (!api) throw new Error('unavailable');
      const { data, error } = await api.from(TABLE).select('*');
      if (error) throw error;
      state.entries = data || [];
      sortEntries();
    } catch (err) {
      console.error(err);
      state.loadError = true;
    }
    state.loading = false;
    renderAll();
  }

  async function uploadBill(file) {
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = uid() + '.' + (ext || 'bin');
    const { error } = await api.storage.from(BUCKET).upload(path, file, { contentType: file.type, upsert: false });
    if (error) throw error;
    return path;
  }

  async function removeBillFile(path) {
    try { await api.storage.from(BUCKET).remove([path]); } catch (e) { console.error(e); }
  }

  /* ---------- Rendering ---------- */
  function filtered() {
    return state.entries.filter((e) =>
      (state.month === 'all' || e.expense_date.startsWith(state.month)) &&
      (!state.category || e.category === state.category));
  }

  function renderFilters() {
    const months = new Set(state.entries.map((e) => e.expense_date.slice(0, 7)));
    months.add(currentMonth());
    if (state.month !== 'all') months.add(state.month);
    const sorted = [...months].sort().reverse();
    els.month.innerHTML = '<option value="all">All months</option>' +
      sorted.map((m) => `<option value="${m}">${esc(monthLabel(m))}</option>`).join('');
    els.month.value = state.month;
    els.filterCat.value = state.category;
  }

  function renderSummary(list) {
    const busy = state.loading || state.loadError;
    if (busy) {
      els.total.textContent = '—';
      els.caption.textContent = state.loading ? 'Loading entries…' : '';
      els.bar.innerHTML = ''; els.legend.innerHTML = '';
      return;
    }
    const total = list.reduce((s, e) => s + Number(e.amount), 0);
    const byCat = {};
    list.forEach((e) => { byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount); });
    const rows = Object.entries(byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    const positive = rows.reduce((s, [, v]) => s + v, 0);

    const period = state.month === 'all' ? 'all months' : monthLabel(state.month);
    const n = list.length;
    els.total.textContent = money(total);
    els.caption.textContent = `${n} ${n === 1 ? 'entry' : 'entries'} for ${period}` + (state.category ? ` in ${state.category}` : '');

    els.bar.innerHTML = rows.map(([c, v]) =>
      `<span style="width:${(v / positive * 100).toFixed(2)}%;background:${COLORS[c] || '#999'}" title="${esc(c)}: ${esc(money(v))}"></span>`
    ).join('');
    els.legend.innerHTML = rows.map(([c, v]) =>
      `<li><span class="swatch" style="background:${COLORS[c] || '#999'}"></span>${esc(c)} <b>${esc(money(v))}</b></li>`
    ).join('');
  }

  function renderList(list) {
    if (state.loading) { els.list.innerHTML = '<li class="empty">Loading entries…</li>'; return; }
    if (state.loadError) {
      els.list.innerHTML = '<li class="empty"><strong>Couldn\u2019t load your expenses</strong>Check your internet connection, then <button type="button" class="link-btn" data-action="retry">try again</button>.</li>';
      return;
    }
    if (!state.entries.length) {
      els.list.innerHTML = '<li class="empty"><strong>No expenses yet</strong>Add your first entry using the form.</li>';
      return;
    }
    if (!list.length) {
      els.list.innerHTML = '<li class="empty"><strong>Nothing matches these filters</strong>Try another month or category.</li>';
      return;
    }
    els.list.innerHTML = list.map((e) => `
      <li class="item${e.id === state.editingId ? ' editing' : ''}">
        <div class="item-title">${esc(e.description)}</div>
        <div class="item-amount">${esc(money(Number(e.amount)))}</div>
        <div class="item-meta">
          <span class="cat"><span class="swatch" style="background:${COLORS[e.category] || '#999'}"></span>${esc(e.category)}</span>
          <span>${esc(e.paid_by)}</span>
          <span>${esc(fmtDate(e.expense_date))}</span>
        </div>
        ${e.notes ? `<div class="item-notes">${esc(e.notes)}</div>` : ''}
        <div class="item-actions">
          ${e.bill_path ? `<button type="button" class="link-btn" data-action="view" data-id="${esc(e.id)}">${ICON.clip}View bill</button>` : ''}
          <button type="button" class="link-btn" data-action="edit" data-id="${esc(e.id)}">${ICON.edit}Edit</button>
          <button type="button" class="link-btn danger" data-action="delete" data-id="${esc(e.id)}">${ICON.trash}Delete</button>
        </div>
      </li>`).join('');
  }

  function renderAll() {
    renderFilters();
    const list = filtered();
    renderSummary(list);
    renderList(list);
  }

  /* ---------- Form state ---------- */
  function currentEntry() { return state.entries.find((e) => e.id === state.editingId) || null; }

  function renderBillField() {
    const existing = currentEntry();
    let html = '';
    if (existing && existing.bill_path) {
      if (state.removeBill) {
        html += '<div class="bill-current"><span>The current bill will be removed when you save.</span><button type="button" class="link-btn" data-bill="keep">Keep bill</button></div>';
      } else if (!state.file) {
        html += `<div class="bill-current"><span class="name">${esc(existing.bill_name || 'Attached bill')}</span><span><button type="button" class="link-btn" data-bill="view">View</button><button type="button" class="link-btn danger" data-bill="remove">Remove</button></span></div>`;
      }
    }
    if (state.file) {
      html += `<div class="bill-current"><span class="name">${esc(state.file.name)}${existing && existing.bill_path ? '<small>Replaces the current bill</small>' : ''}</span><button type="button" class="link-btn danger" data-bill="clear">Clear</button></div>`;
    }
    els.billState.innerHTML = html;
    els.dropText.textContent = (existing && existing.bill_path) || state.file ? 'Choose a different file' : 'Attach a PDF or image';
  }

  function updateFormMode() {
    const editing = !!state.editingId;
    els.formTitle.textContent = editing ? 'Edit expense' : 'Add an expense';
    els.submit.textContent = state.saving ? 'Saving…' : (editing ? 'Save changes' : 'Add expense');
    els.submit.disabled = state.saving;
    els.cancel.hidden = !editing;
    renderBillField();
  }

  function resetForm() {
    state.editingId = null; state.file = null; state.removeBill = false;
    els.form.reset();
    els.category.value = '';
    els.date.value = todayStr();
    els.file.value = '';
    updateFormMode();
  }

  function startEdit(id) {
    const e = state.entries.find((x) => x.id === id);
    if (!e) return;
    state.editingId = id; state.file = null; state.removeBill = false;
    els.file.value = '';
    els.date.value = e.expense_date;
    els.amount.value = e.amount;
    els.desc.value = e.description;
    els.category.value = e.category;
    const radio = els.form.querySelector(`input[name="paid_by"][value="${CSS.escape(e.paid_by)}"]`);
    if (radio) radio.checked = true;
    els.notes.value = e.notes || '';
    updateFormMode();
    renderList(filtered());
    els.form.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
    els.desc.focus({ preventScroll: true });
  }

  /* ---------- Save ---------- */
  async function saveEntry(ev) {
    ev.preventDefault();
    if (state.saving) return;

    const fields = {
      expense_date: els.date.value,
      description: els.desc.value.trim(),
      category: els.category.value,
      paid_by: els.form.querySelector('input[name="paid_by"]:checked').value,
      amount: parseFloat(els.amount.value),
      notes: els.notes.value.trim() || null
    };
    if (!fields.description) { toast('Enter a description for this expense.', 'error'); els.desc.focus(); return; }
    if (!fields.category) { toast('Choose a category.', 'error'); els.category.focus(); return; }
    if (!Number.isFinite(fields.amount)) { toast('Enter a valid amount.', 'error'); els.amount.focus(); return; }

    const existing = currentEntry();
    const editing = !!existing;
    state.saving = true; updateFormMode();

    let newPath = null;
    try {
      if (!api) throw new Error('unavailable');
      const row = Object.assign({}, fields);
      if (state.file) {
        newPath = await uploadBill(state.file);
        Object.assign(row, { bill_path: newPath, bill_name: state.file.name, bill_type: state.file.type });
      } else if (editing && state.removeBill) {
        Object.assign(row, { bill_path: null, bill_name: null, bill_type: null });
      }

      let result;
      if (editing) {
        row.updated_at = new Date().toISOString();
        result = await api.from(TABLE).update(row).eq('id', existing.id).select().single();
      } else {
        result = await api.from(TABLE).insert(row).select().single();
      }
      if (result.error) throw result.error;

      if (editing && existing.bill_path && (state.file || state.removeBill)) {
        await removeBillFile(existing.bill_path);
      }

      const saved = result.data;
      if (editing) state.entries = state.entries.map((e) => (e.id === saved.id ? saved : e));
      else state.entries.push(saved);
      sortEntries();

      // Make sure the saved entry is visible under the current filters
      if (state.month !== 'all' && !saved.expense_date.startsWith(state.month)) state.month = saved.expense_date.slice(0, 7);
      if (state.category && state.category !== saved.category) state.category = '';

      toast(editing ? 'Changes saved.' : 'Expense added.');
      state.saving = false;
      resetForm();
      renderAll();
    } catch (err) {
      console.error(err);
      if (newPath) await removeBillFile(newPath);
      state.saving = false; updateFormMode();
      toast('Couldn\u2019t save this expense. Check your connection and try again.', 'error');
    }
  }

  /* ---------- Delete ---------- */
  function confirmDelete(entry) {
    return new Promise((resolve) => {
      els.confirmText.textContent = `\u201C${entry.description}\u201D for ${money(Number(entry.amount))} will be removed` +
        (entry.bill_path ? ', along with its bill' : '') + '. This can\u2019t be undone.';
      els.confirm.returnValue = '';
      els.confirm.addEventListener('close', () => resolve(els.confirm.returnValue === 'delete'), { once: true });
      els.confirm.showModal();
    });
  }

  async function deleteEntry(id) {
    const entry = state.entries.find((e) => e.id === id);
    if (!entry) return;
    if (!(await confirmDelete(entry))) return;
    try {
      if (!api) throw new Error('unavailable');
      const { error } = await api.from(TABLE).delete().eq('id', id);
      if (error) throw error;
      if (entry.bill_path) await removeBillFile(entry.bill_path);
      state.entries = state.entries.filter((e) => e.id !== id);
      if (state.editingId === id) resetForm();
      renderAll();
      toast('Expense deleted.');
    } catch (err) {
      console.error(err);
      toast('Couldn\u2019t delete this expense. Try again.', 'error');
    }
  }

  /* ---------- Bill viewer ---------- */
  let blobUrl = null;
  let viewToken = 0;

  function clearViewer() {
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    els.billBody.innerHTML = '';
    els.billOpen.hidden = true; els.billDownload.hidden = true;
    els.billOpen.removeAttribute('href'); els.billDownload.removeAttribute('href');
  }

  async function viewBill(id) {
    const entry = state.entries.find((e) => e.id === id);
    if (!entry || !entry.bill_path) return;
    const token = ++viewToken;
    clearViewer();
    els.billTitle.textContent = entry.bill_name || 'Bill';
    els.billBody.textContent = 'Loading bill…';
    if (!els.billDialog.open) els.billDialog.showModal();
    try {
      if (!api) throw new Error('unavailable');
      const { data, error } = await api.storage.from(BUCKET).download(entry.bill_path);
      if (error) throw error;
      if (token !== viewToken || !els.billDialog.open) return;
      const type = entry.bill_type || data.type || 'application/octet-stream';
      blobUrl = URL.createObjectURL(new Blob([data], { type }));
      if (type.startsWith('image/')) {
        els.billBody.innerHTML = `<img src="${blobUrl}" alt="${esc(entry.bill_name || 'Bill image')}">`;
      } else {
        els.billBody.innerHTML = `<iframe src="${blobUrl}" title="${esc(entry.bill_name || 'Bill PDF')}"></iframe>`;
      }
      els.billOpen.href = blobUrl; els.billOpen.hidden = false;
      els.billDownload.href = blobUrl; els.billDownload.download = entry.bill_name || 'bill'; els.billDownload.hidden = false;
    } catch (err) {
      console.error(err);
      if (token === viewToken) els.billBody.textContent = 'This bill couldn\u2019t be loaded. Check your connection and try again.';
    }
  }

  els.billClose.addEventListener('click', () => els.billDialog.close());
  els.billDialog.addEventListener('click', (e) => { if (e.target === els.billDialog) els.billDialog.close(); });
  els.billDialog.addEventListener('close', () => { viewToken++; clearViewer(); });

  /* ---------- Events ---------- */
  els.form.addEventListener('submit', saveEntry);
  els.cancel.addEventListener('click', () => { resetForm(); renderList(filtered()); });

  els.file.addEventListener('change', () => {
    const f = els.file.files[0];
    if (!f) return;
    if (!ALLOWED_TYPES.includes(f.type)) {
      toast('Attach a PDF or an image (JPG, PNG, WebP or GIF).', 'error'); els.file.value = ''; return;
    }
    if (f.size > MAX_FILE) {
      toast('That file is over 10 MB. Choose a smaller one.', 'error'); els.file.value = ''; return;
    }
    state.file = f; state.removeBill = false;
    renderBillField();
  });

  els.billState.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-bill]');
    if (!btn) return;
    const act = btn.dataset.bill;
    if (act === 'view' && state.editingId) viewBill(state.editingId);
    if (act === 'remove') { state.removeBill = true; renderBillField(); }
    if (act === 'keep') { state.removeBill = false; renderBillField(); }
    if (act === 'clear') { state.file = null; els.file.value = ''; renderBillField(); }
  });

  els.list.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    switch (btn.dataset.action) {
      case 'view': viewBill(id); break;
      case 'edit': startEdit(id); break;
      case 'delete': deleteEntry(id); break;
      case 'retry': loadEntries(); break;
    }
  });

  els.month.addEventListener('change', () => { state.month = els.month.value; renderAll(); });
  els.filterCat.addEventListener('change', () => { state.category = els.filterCat.value; renderAll(); });

  /* ---------- Start ---------- */
  updateFormMode();
  loadEntries();
})();
</script>
</body>
</html>
